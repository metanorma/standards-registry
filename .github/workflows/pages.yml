name: pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage schemas at their $id paths
        run: |
          mkdir -p site/registry/documents-index site/registry/search-index
          cp schema/documents-index.schema.json site/registry/documents-index/v1.json
          cp schema/search-index.schema.json site/registry/search-index/v1.json
          cat > site/index.html <<'HTML'
          <!DOCTYPE html>
          <html><head><meta charset="utf-8"><title>standards-registry schemas</title></head>
          <body><h1>standards-registry</h1>
          <p>Registry contract schemas served at their $id paths:</p>
          <ul>
            <li><a href="/standards-registry/registry/documents-index/v1.json">/registry/documents-index/v1.json</a></li>
            <li><a href="/standards-registry/registry/search-index/v1.json">/registry/search-index/v1.json</a></li>
          </ul>
          <p>Canonical host: https://schemas.metanorma.org (served by metanorma/schemas; this Pages is the staging origin).</p>
          </body></html>
          HTML

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
